# Node.js 24-compatible GitHub Pages deployment
name: Deploy Watched Logger (Node 24)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Check application behavior
        run: node --test tests/*.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage runtime site
        run: |
          mkdir -p _site
          cp index.html library-gallery.js library-gallery.css manifest.webmanifest sw.js _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
