    if(!await restorePinSession()){
      showAuth();
      if(!publicMaintenance.enabled)await prefillLegacyAccount();
    }
  }
  start().catch(err=>{console.error(err);showAuth();showMessage(`Watched Logger could not start: ${err.message||err}`);});
  </script>
</body>
</html>
